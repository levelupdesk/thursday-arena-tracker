# Touched 2026-09-25 04:45 UTC so GitHub re-reads this cron from main. The in-repo cron is the backup; workflow_dispatch stays available.
name: Snapshot and publish

on:
  push:
    branches: [main]
  # GitHub registers this cron only from the default branch, and it can drop
  # the first slots after the workflow file is added. A change to this file on
  # main is what makes Actions read the schedule again. Minutes 2, 17, 32, and
  # 47 stay off the top of the hour, when scheduled workflows are most often delayed.
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: thursday-arena-tracker
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Collect leaderboard snapshot
        if: github.event_name != 'push'
        # Records what it read in .cache/snapshot-result.json; the verify steps below fail the run.
        run: node scripts/snapshot.mjs
      - name: Commit snapshot data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seasons data/catalog
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: record ladder snapshot"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - run: npm ci
      - name: Build site
        env:
          BASE_PATH: /thursday-arena-tracker/
        run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
      # A snapshot run must turn red when the data it published did not move with the source:
      # failed or empty ladder read, published board different from the API board, last_checked
      # not advanced, or a match on the board after the latest snapshot with the board unchanged.
      # These run after deploy so the page still gets whatever data this run has.
      - name: Verify built data matches this run's API read
        if: github.event_name != 'push'
        run: node scripts/verify-publish.mjs --built dist/data/site-data.json
      - name: Verify the live page serves this run's data
        if: github.event_name != 'push'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
        run: node scripts/verify-publish.mjs --live "${PAGE_URL%/}/data/site-data.json"
